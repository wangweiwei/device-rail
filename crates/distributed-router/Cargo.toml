[package]
name = "devicerail-distributed-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
devicerail-core = { path = "../core" }
devicerail-protocol = { path = "../protocol" }
devicerail-remote-auth = { path = "../remote-auth" }
futures-util.workspace = true
hex.workspace = true
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
devicerail-core = { path = "../core", features = ["conformance-json-schema"] }
devicerail-driver-mock = { path = "../driver-mock" }
devicerail-evidence-fs = { path = "../evidence-fs" }
jsonschema.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
